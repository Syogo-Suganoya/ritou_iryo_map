name: CI / Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  check:
    name: Lint / 型チェック / ビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: 型チェック
        run: npx tsc --noEmit

      - name: Next.js ビルド
        run: npm run build

  deploy:
    name: Cloudflare Workers へデプロイ
    needs: check
    # main への push（と手動実行）のときだけデプロイする。PRはcheckまで
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # wrangler.jsonc にはプレースホルダのまま置いてあるので、Secret の実IDに差し替える。
      # 実IDを直接コミットしている場合はプレースホルダが無いため何も起こらない
      - name: Hyperdrive ID を埋め込む
        env:
          HYPERDRIVE_ID: ${{ secrets.HYPERDRIVE_ID }}
        run: |
          if grep -q '<HYPERDRIVE_ID>' wrangler.jsonc; then
            if [ -z "$HYPERDRIVE_ID" ]; then
              echo "::error::wrangler.jsonc がプレースホルダのままですが、secrets.HYPERDRIVE_ID が未設定です"
              exit 1
            fi
            sed -i "s|<HYPERDRIVE_ID>|${HYPERDRIVE_ID}|" wrangler.jsonc
          fi

      - name: デプロイ
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || 'a128e75b7210f99f780cccff2c2cf5ab' }}
        run: npm run cf:deploy
